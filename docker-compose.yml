version: '3.8'

services:
  api:
    build: .
    container_name: lof-api
    restart: unless-stopped
    volumes:
      # 数据持久化：LOF 历史行情数据
      - ./data:/app/data
      # 日志持久化
      - ./logs:/app/logs
      # 同步时间记录
      - ./last_sync_time.txt:/app/last_sync_time.txt
      - ./last_sync_report.json:/app/last_sync_report.json
    environment:
      - TZ=Asia/Shanghai
    networks:
      - lof-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: lof-nginx
    restart: unless-stopped
    ports:
      # 极空间访问端口，可自行修改左侧数字
      - "8080:80"
    volumes:
      # H5 前端页面
      - ./h5:/usr/share/nginx/html:ro
      # Nginx 配置
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - lof-network

networks:
  lof-network:
    driver: bridge

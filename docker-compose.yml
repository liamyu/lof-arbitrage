version: '3.8'

services:
  api:
    build: .
    container_name: lof-api
    restart: unless-stopped
    volumes:
      # 数据持久化：LOF 历史行情数据 + 同步状态文件（last_sync_time.txt 等）
      # ⚠️ 替换 <YOUR_USER_ID> 为你的极空间实际路径
      - /tmp/zfsv3/nvme12/<YOUR_USER_ID>/data/docker/lof/data:/app/data
      # 日志持久化
      - /tmp/zfsv3/nvme12/<YOUR_USER_ID>/data/docker/lof/logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    networks:
      - lof-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/meta/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: lof-nginx
    restart: unless-stopped
    ports:
      # 极空间访问端口，可自行修改左侧数字
      - "18080:80"
    volumes:
      # H5 前端页面
      # ⚠️ 替换 <YOUR_USER_ID> 为你的极空间实际路径
      - /tmp/zfsv3/nvme12/<YOUR_USER_ID>/data/docker/lof/h5:/usr/share/nginx/html:ro
      # Nginx 配置
      - /tmp/zfsv3/nvme12/<YOUR_USER_ID>/data/docker/lof/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - lof-network

networks:
  lof-network:
    driver: bridge

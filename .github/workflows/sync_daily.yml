name: Sync Daily Job

on:
  workflow_dispatch:
  schedule:
    # 北京时间交易日多个盘中时点 + 晚间更新
    # UTC = BJ - 8h
    - cron: "30 1 * * *"    # 09:30 BJ
    - cron: "30 2 * * *"    # 10:30 BJ
    - cron: "30 3 * * *"    # 11:30 BJ
    - cron: "30 5 * * *"    # 13:30 BJ
    - cron: "0  6 * * *"    # 14:00 BJ
    - cron: "15 6 * * *"    # 14:15 BJ
    - cron: "30 6 * * *"    # 14:30 BJ
    - cron: "45 6 * * *"    # 14:45 BJ
    - cron: "0  7 * * *"    # 15:00 BJ
    - cron: "0 13 * * *"    # 21:00 BJ

jobs:
  run-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1️⃣ 同步 LOF 数据（带重试）
      - name: Run sync_daily.py
        id: sync
        run: |
          python scripts/sync_daily.py 2>&1 | tee logs/sync_${{ github.run_id }}.log
        continue-on-error: true

      # 2️⃣ 获取基金申购数据
      - name: Run fetch_fund_purchase.py
        id: fetch
        run: |
          python scripts/fetch_fund_purchase.py 2>&1 | tee logs/fund_purchase_${{ github.run_id }}.log
        continue-on-error: true

      # 3️⃣ 数据质量检查
      - name: Data quality check
        id: quality
        run: |
          python scripts/data_quality_check.py 2>&1 | tee logs/quality_${{ github.run_id }}.log
        continue-on-error: true

      # 4️⃣ bump APP_VERSION
      - name: Bump APP_VERSION
        run: |
          VERSION=$(date -u +"%Y-%m-%d %H:%M UTC")
          sed -i "s/^APP_VERSION = .*/APP_VERSION = \"$VERSION\"/" scripts/LOF_dashboard.py
          echo "APP_VERSION bumped to $VERSION"

      # 5️⃣ 提交本地变更
      - name: Commit local changes
        env:
          MY_TOKEN: ${{ secrets.LOF_PUSH_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git remote set-url origin "https://x-access-token:${MY_TOKEN}@github.com/skyz72432-max/lof-arbitrage.git"

          mkdir -p logs
          git add data/ last_sync_time.txt fund_purchase_em_*.csv scripts/LOF_dashboard.py logs/

          if git diff --staged --quiet; then
            echo "🟡 No changes to commit"
          else
            git commit -m "🤖 Auto sync: daily data & fund purchase update [run=${{ github.run_id }}]"
          fi

      # 6️⃣ rebase + push
      - name: Pull & Push
        env:
          MY_TOKEN: ${{ secrets.LOF_PUSH_TOKEN }}
        run: |
          git pull origin main --rebase --autostash
          git push origin main

      # 7️⃣ 失败通知
      - name: Notify on failure
        if: ${{ failure() || steps.sync.outcome == 'failure' || steps.fetch.outcome == 'failure' || steps.quality.outcome == 'failure' }}
        run: |
          echo "❌ 同步任务失败或数据质量检查未通过"
          echo "sync=${{ steps.sync.outcome }}, fetch=${{ steps.fetch.outcome }}, quality=${{ steps.quality.outcome }}"
          exit 1
